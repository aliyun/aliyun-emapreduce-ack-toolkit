name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # google-java-format requires JDK 11+ to run, even though the artifact targets Java 8.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java formatting (Spotless)
        working-directory: spark-submit
        run: mvn -B -ntp spotless:check

  build:
    needs: spotless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build self-extracting executables
        working-directory: spark-submit
        run: bash create-spark-submit.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spark-tools
          path: |
            spark-submit/spark-submit
            spark-submit/spark-sql
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            spark-submit/spark-submit
            spark-submit/spark-sql

      - name: Refresh rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --title "Latest build (main)" \
            --notes "Rolling pre-release built automatically from the newest commit on \`main\` (${GITHUB_SHA::7}). Updated on every push to main." \
            --prerelease \
            --target "$GITHUB_SHA" \
            spark-submit/spark-submit spark-submit/spark-sql
